<div class="wrap" id="app">

      환불율 = 주간 취소건수 ÷ 주간 결제건수(생성주 기준) · 캐시 30분

        <option value="300" selected>표 최근 300건</option>

    </div>

  </div>

<script>
const TOKEN_KEY="cs_token";
const $=(id)=>document.getElementById(id);
let consultData=null;
function goLogin(){localStorage.removeItem(TOKEN_KEY);location.href="/cs";}
function fmtPct(v){return (v===null||v===undefined)?"—":v.toFixed(1)+"%";}
function fmtNum(v){return (v===null||v===undefined)?"—":Number(v).toLocaleString();}
function esc(s){return (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function wowEl(v){
  if(v===null||v===undefined) return '<span class="wow flat">전주대비 —</span>';
  const cls=v>0?'up':v<0?'down':'flat', a=v>0?'▲':v<0?'▼':'—';
  return `<span class="wow ${cls}">전주대비 ${a} ${Math.abs(v).toFixed(1)}p</span>`;
}
function authHeader(){return {Authorization:"Bearer "+localStorage.getItem(TOKEN_KEY)};}
function alertsHtml(alerts){
  if(!alerts||!alerts.length) return `<div class="alerts"><div class="alert ok">✓ 특이 경보 없음</div></div>`;
  const ic={bad:"🔴",warn:"🟠",ok:"🟢"};
  return `<div class="alerts">`+alerts.map(a=>`<div class="alert ${a.level||'warn'}">${ic[a.level]||"⚠"} ${esc(a.text)}</div>`).join("")+`</div>`;
}
function logout(){goLogin();}
function switchView(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===v));
  $("view-metrics").style.display = v==="metrics"?"block":"none";
  $("view-consult").style.display = v==="consult"?"block":"none";
  if(v==="consult" && !consultData) loadConsult(false);
}
async function loadMetrics(refresh){
  if(!localStorage.getItem(TOKEN_KEY)){goLogin();return;}
  $("metricsContent").innerHTML='<div class="nodata">불러오는 중… (채널톡 집계는 수십 초 걸릴 수 있어요)</div>';
  try{
    const r=await fetch(`/api/cs/metrics?weeks=${$("weeks").value}&refresh=${refresh?1:0}`,{headers:authHeader()});
    if(r.status===401){goLogin();return;}
    if(!r.ok){const e=await r.json().catch(()=>({}));$("metricsContent").innerHTML=`<div class="banner">집계 실패: ${e.error||r.status}</div>`;return;}
    renderMetrics(await r.json());
  }catch(e){$("metricsContent").innerHTML=`<div class="banner">네트워크 오류: ${e.message}</div>`;}
}
function renderMetrics(d){
  $("genAt").textContent="기준 "+(d.generated_at||"")+" · 최신 완료주 "+(d.latest?d.latest.week:"—");
  const L=d.latest||{}, src=d.sources||{};
  const maxI=Math.max(1,...d.weeks.map(w=>w.inflow_rate||0)), maxR=Math.max(1,...d.weeks.map(w=>w.refund_rate||0));
  const isrc = src.inflow_source==='sheet'?'시트':'채널톡';
  let h=alertsHtml(d.alerts);
  h+=`<div class="badges">
    <span class="badge ${src.bigquery?'ok':'no'}">BigQuery ${src.bigquery?'OK':'실패'}</span>
    <span class="badge ${src.inflow?'ok':'no'}">인입(${isrc}) ${src.inflow?'OK':'실패'}</span></div>`;
  if(d.errors&&d.errors.length) h+=`<div class="banner">⚠ ${d.errors.map(esc).join(" · ")}</div>`;
  h+=`<div class="cards">
    <div class="card"><div class="label">CS 인입률</div><div class="val">${fmtPct(L.inflow_rate)}</div>${wowEl(L.inflow_rate_wow)}</div>
    <div class="card"><div class="label">환불율</div><div class="val">${fmtPct(L.refund_rate)}</div>${wowEl(L.refund_rate_wow)}</div>
    <div class="card"><div class="label">주간 고유 구매자</div><div class="val">${fmtNum(L.buyers)}<small> 명</small></div></div>
    <div class="card"><div class="label">주간 CS 인입</div><div class="val">${fmtNum(L.inflow)}<small> 건</small></div></div></div>`;
  h+=`<table><thead><tr>
    <th class="l">주(월)</th><th>CS인입</th><th>구매자</th><th>인입률</th><th class="l">추이</th>
    <th>결제</th><th>취소</th><th>환불율</th><th class="l">추이</th></tr></thead><tbody>`;
  for(const w of d.weeks){
    const iw=w.inflow_rate?Math.round(w.inflow_rate/maxI*60):0, rw=w.refund_rate?Math.round(w.refund_rate/maxR*60):0;
    h+=`<tr class="${w.partial?'partial':''}">
      <td class="l">${w.week}${w.partial?'<span class="tag">진행중</span>':''}</td>
      <td>${fmtNum(w.inflow)}</td><td>${fmtNum(w.buyers)}</td><td>${fmtPct(w.inflow_rate)}</td>
      <td class="l"><span class="bar" style="width:${iw}px"></span></td>
      <td>${fmtNum(w.paid_orders)}</td><td>${fmtNum(w.cancelled_orders)}</td><td>${fmtPct(w.refund_rate)}</td>
      <td class="l"><span class="bar" style="width:${rw}px;background:#ff6b6b"></span></td></tr>`;
  }
  h+=`</tbody></table>`;
  $("metricsContent").innerHTML=h;
}
function isoDaysAgo(n){ const d=new Date(Date.now()-n*86400000); return d.toISOString().slice(0,10); }
function getRange(){
  const v=$("cRange").value;
  if(v==="all") return {from:"",to:""};
  if(v==="custom") return {from:$("cFrom").value||"",to:$("cTo").value||""};
  return {from:isoDaysAgo(parseInt(v)),to:""};
}
function syncRangeInputs(){
  const cust=($("cRange").value==="custom");
  $("cFrom").disabled=$("cTo").disabled=!cust;
  if(!cust){ const r=getRange(); $("cFrom").value=r.from; $("cTo").value=r.to; }
}
async function loadConsult(refresh){
  if(!localStorage.getItem(TOKEN_KEY)){goLogin();return;}
  const rg=getRange();
  $("consultContent").innerHTML='<div class="nodata">시트에서 불러오는 중…</div>';
  try{
    const r=await fetch(`/api/cs/consultations?limit=${$("cLimit").value}&refresh=${refresh?1:0}&date_from=${rg.from}&date_to=${rg.to}`,{headers:authHeader()});
    if(r.status===401){goLogin();return;}
    if(!r.ok){const e=await r.json().catch(()=>({}));$("consultContent").innerHTML=`<div class="banner">집계 실패: ${e.error||r.status}</div>`;return;}
    consultData=await r.json(); buildTypeFilter(); renderConsult();
  }catch(e){$("consultContent").innerHTML=`<div class="banner">네트워크 오류: ${e.message}</div>`;}
}
function buildTypeFilter(){
  const sel=$("cType"), cur=sel.value;
  const types=(consultData.summary.by_type||[]).map(t=>t.key);
  sel.innerHTML='<option value="">유형 전체</option>'+types.map(t=>`<option value="${esc(t)}">${esc(t)} (${(consultData.summary.by_type.find(x=>x.key===t)||{}).count})</option>`).join("");
  if(types.includes(cur)) sel.value=cur;
}
function distBox(title,arr,total){
  const max=Math.max(1,...arr.map(x=>x.count));
  let h=`<div class="box"><h3>${title}</h3>`;
  for(const x of arr.slice(0,8)){
    const w=Math.round(x.count/max*150);
    h+=`<div class="barrow"><span class="k" title="${esc(x.key)}">${esc(x.key)}</span><span class="b" style="width:${w}px"></span><span class="n">${x.count} (${(100*x.count/total).toFixed(0)}%)</span></div>`;
  }
  return h+`</div>`;
}
function toggleDetail(id){ const e=document.getElementById(id); if(e){ const open=e.style.display!=='none'; e.style.display=open?'none':'block'; const a=document.getElementById(id+'a'); if(a)a.textContent=open?'▸':'▾'; } }
function typeDistBox(arr,detail,total){
  const max=Math.max(1,...arr.map(x=>x.count));
  let h=`<div class="box"><h3>문의유형(대분류) — 클릭하면 상세 펼침</h3>`;
  arr.slice(0,12).forEach((x,i)=>{
    const w=Math.round(x.count/max*150), id=`td${i}`;
    const det=(detail&&detail[x.key])||[];
    h+=`<div class="barrow" style="cursor:pointer" onclick="toggleDetail('${id}')">
      <span class="k" title="${esc(x.key)}"><span id="${id}a">▸</span> ${esc(x.key)}</span>
      <span class="b" style="width:${w}px"></span>
      <span class="n">${x.count} (${(100*x.count/total).toFixed(0)}%)</span></div>`;
    h+=`<div id="${id}" class="tdetail" style="display:none">`;
    if(det.length){
      const dmax=Math.max(1,...det.map(d=>d.count));
      for(const d of det.slice(0,15)){
        const dw=Math.round(d.count/dmax*100);
        h+=`<div class="barrow" style="font-size:11px;margin-left:18px"><span class="k muted" title="${esc(d.key)}">${esc(d.key)}</span><span class="b" style="width:${dw}px;background:#3a4150"></span><span class="n">${d.count} (${(100*d.count/x.count).toFixed(0)}%)</span></div>`;
      }
    } else h+=`<span class="muted" style="font-size:11px;margin-left:18px">상세 없음</span>`;
    h+=`</div>`;
  });
  return h+`</div>`;
}
function wkLabel(s){ const p=String(s).split("-"); return p.length===3?`${+p[1]}/${+p[2]}`:s; }
function trendSection(ins){
  const trend=ins.type_trend||[], weeks=ins.trend_weeks||[];
  if(!trend.length||!weeks.length) return "";
  let h=`<div class="sec"><h3>문의유형 주간 추이 — 주별 건수 · 마지막 열=직전주 대비 증감 (🔴=급증 +30%↑)</h3>`;
  h+=`<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr><th class="l">유형</th>`;
  weeks.forEach((w,i)=>{ h+=`<th>${wkLabel(w)}${i===weeks.length-1?' <span class="muted">(최근)</span>':''}</th>`; });
  h+=`<th>증감</th></tr></thead><tbody>`;
  for(const t of trend){
    const mx=Math.max(1,...t.series);
    const spike=(t.wow_pct!=null&&t.wow_pct>=30&&t.latest>=5);
    h+=`<tr><td class="l">${spike?'🔴 ':''}${esc(t.type)} <span class="muted">(${t.total})</span></td>`;
    t.series.forEach((v,i)=>{
      const a=v?(0.10+0.5*v/mx):0; const last=(i===t.series.length-1);
      h+=`<td style="background:rgba(91,140,255,${a.toFixed(2)});${last?'font-weight:700':''}">${v||''}</td>`;
    });
    const wow=t.wow_pct==null?'—':`${t.wow_pct>0?'+':''}${t.wow_pct}%`;
    h+=`<td class="wown ${spike?'spike':''}">${wow}</td></tr>`;
  }
  return h+`</tbody></table></div></div>`;
}
function heatSection(ins){
  const hm=ins.heatmap; if(!hm||!hm.grid) return "";
  let mx=1; for(const row of hm.grid) for(const v of row) if(v>mx) mx=v;
  let pk={wd:0,hr:0,v:0}; for(let w=0;w<7;w++)for(let hr=0;hr<24;hr++)if(hm.grid[w][hr]>pk.v)pk={wd:w,hr,v:hm.grid[w][hr]};
  let h=`<div class="sec"><h3>시간대·요일 히트맵 — 셀=건수, 진할수록 많음 · 피크 ${hm.weekdays[pk.wd]} ${pk.hr}시(${pk.v}건)</h3>`;
  h+=`<div class="heat"><table><tr><th class="lbl">요일\\시</th>`;
  for(let hr=0;hr<24;hr++) h+=`<th>${hr}</th>`;
  h+=`<th class="lbl">합</th></tr>`;
  for(let wd=0;wd<7;wd++){
    h+=`<tr><td class="lbl">${hm.weekdays[wd]}</td>`;
    for(let hr=0;hr<24;hr++){
      const v=hm.grid[wd][hr], a=v?(0.12+0.88*v/mx):0;
      const tcol=a>0.55?'#fff':'#cdd2da';
      h+=`<td class="c" style="background:rgba(91,140,255,${a.toFixed(2)});color:${tcol}" title="${hm.weekdays[wd]} ${hr}시: ${v}건">${v||''}</td>`;
    }
    h+=`<td class="lbl">${fmtNum(hm.weekday_total[wd])}</td></tr>`;
  }
  h+=`</table></div><div class="muted" style="font-size:11px;margin-top:8px">색 범례: 연함=적음 → 진함=많음 · 숫자=해당 요일·시간 인입 건수</div></div>`;
  return h+`</div>`;
}
function listSection(title, count, rows, accent){
  if(!count) return "";
  let h=`<div class="sec"><details><summary style="cursor:pointer;color:${accent||'var(--accent)'};font-size:13px;font-weight:600">${title} ${fmtNum(count)}건 보기 (최근순 ${rows.length})</summary>
    <table style="margin-top:10px"><thead><tr><th class="l">날짜</th><th class="l">고객ID</th><th class="l">유형(대)</th><th class="l">유형(상세)</th><th class="l">AI요약</th></tr></thead><tbody>`;
  for(const r of rows){
    h+=`<tr><td class="l">${esc(r["날짜"])}</td><td class="l"><span class="pill">${esc(r["고객ID"])}</span></td>
      <td class="l">${esc(r["문의유형(대분류)"])}</td><td class="l">${esc(r["문의유형(상세)"])}</td><td class="ai">${esc(r["AI요약"])}</td></tr>`;
  }
  return h+`</tbody></table></details></div>`;
}
function unresolvedSection(ins){
  return listSection("🔴 열린(미처리) 상담", ins.open_count, ins.open_rows||[], "#ff9b9b")
       + listSection("1차 미해결(재응대 필요)", ins.first_unresolved_count, ins.first_unresolved_rows||[], "var(--accent)");
}
function complaintSection(ins){
  const cb=ins.complaint_breakdown; if(!cb||!cb.by_type||!cb.by_type.length) return "";
  const bt=cb.by_type, bd=cb.by_detail||[];
  const maxc=Math.max(1,...bt.map(x=>x.complaint));
  let h=`<div class="sec"><h3>🔴 불만 원인 분해 (AI 감성 기준) — 어느 유형이 불만을 끄는가</h3>`;
  h+=`<div style="margin-bottom:12px">`;
  for(const x of bt.slice(0,8)){
    const w=Math.round(x.complaint/maxc*180);
    h+=`<div class="barrow"><span class="k" title="${esc(x.type)}">${esc(x.type)}</span><span class="b" style="width:${w}px;background:#ff6b6b"></span><span class="n">불만 ${fmtNum(x.complaint)} / ${fmtNum(x.total)} · ${x.rate}%</span></div>`;
  }
  h+=`</div>`;
  h+=`<table style="font-size:12px"><thead><tr><th class="l">유형 / 상세</th><th>총</th><th>불만</th><th>불만율</th><th class="l">제품개선</th></tr></thead><tbody>`;
  for(const x of bd.slice(0,12)){
    h+=`<tr><td class="l">${esc(x.type)} / ${esc(x.detail)}</td><td>${fmtNum(x.total)}</td><td>${fmtNum(x.complaint)}</td><td class="wown ${x.rate>=60?'spike':''}">${x.rate}%</td><td class="l">${x.candidate?'🔧 후보':''}</td></tr>`;
  }
  h+=`</tbody></table><div class="muted" style="font-size:11px;margin-top:8px">🔧 제품개선 후보 = 불만율 60%↑ & 물량 30건↑ · 여기부터 고치면 불만·환불 감소 효과 큼 (제품개선 연결용).</div></div>`;
  return h;
}
function sentCard(sent){
  if(!sent) return `<div class="card"><div class="label">불만율(AI)</div><div class="val muted">—</div></div>`;
  const cr=sent.complaint_rate;
  const cov=sent.coverage||0;
  return `<div class="card"><div class="label">불만율 (AI 전수)</div>
    <div class="val">${cr==null?"—":cr+"%"}</div>
    <div class="wow flat">분류 ${cov}% (${fmtNum(sent.classified)}/${fmtNum(sent.total)})</div></div>`;
}
async function fillSentiment(){
  const btn=$("cSent"); if(!btn) return;
  btn.disabled=true; const old=btn.textContent; btn.textContent="분류 중…(최대 1~2분)";
  try{
    const rg=getRange();
    const r=await fetch(`/api/cs/sentiment/fill?n=300&date_from=${rg.from}&date_to=${rg.to}`,{headers:authHeader()});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){alert("분류 실패: "+(j.error||r.status));}
    else {alert(`분류 ${j.classified||0}건 추가 (남은 ${j.remaining??'?'}건). 새로고침합니다.`);}
  }catch(e){alert("네트워크 오류");}
  btn.disabled=false; btn.textContent=old;
  loadConsult(false);
}
function renderConsult(){
  const d=consultData, s=d.summary||{}, ins=d.insights||{};
  let h="";
  if(d.errors&&d.errors.length) h+=`<div class="banner">⚠ ${d.errors.map(esc).join(" · ")}</div>`;
  h+=alertsHtml(ins.alerts);
  h+=`<div class="cards">
    <div class="card"><div class="label">총 상담 건수</div><div class="val">${fmtNum(s.total)}<small> 건</small></div></div>
    <div class="card"><div class="label">1차 해결률</div><div class="val">${fmtPct(s.first_resolution_rate)}</div></div>
    <div class="card"><div class="label">재문의율 <small>(${ins.reopen_days||7}일내)</small></div><div class="val">${fmtPct(ins.reopen_rate)}</div></div>
    <div class="card"><div class="label">1차 미해결 <small>(재응대 필요)</small></div><div class="val">${fmtNum(ins.first_unresolved_count)}<small> 건</small></div></div>
    <div class="card"><div class="label">열린(미처리) 건</div><div class="val ${ins.open_count?'':'muted'}">${fmtNum(ins.open_count)}<small> 건</small></div></div>
    ${sentCard(ins.sentiment)}
    <div class="card"><div class="label">평균 처리시간</div><div class="val">${s.avg_duration_min==null?"—":fmtNum(s.avg_duration_min)}<small> 분</small></div></div>
    <div class="card"><div class="label">고객점수 평균</div><div class="val">${s.avg_score==null?"—":s.avg_score}<small> (${fmtNum(s.score_responses)}건)</small></div></div></div>`;
  const rng=d.range||{};
  const rlabel=(rng.from||rng.to)?`${rng.from||'처음'} ~ ${rng.to||'오늘'}`:'전체';
  h+=`<div class="summary">📅 선택 기간 <b>${rlabel}</b> · 상담 <b>${fmtNum(rng.filtered)}</b>건${rng.all&&rng.filtered!==rng.all?` <span class="muted">(전체 ${fmtNum(rng.all)}건 중)</span>`:''} · 실제 데이터 ${esc(s.date_min)||"—"} ~ ${esc(s.date_max)||"—"}. 아래 표는 최근 ${fmtNum(d.shown)}건.</div>`;
  h+=`<div class="dist">${typeDistBox(s.by_type||[],s.by_type_detail||{},s.total||1)}${distBox("상담채널",s.by_channel||[],s.total||1)}</div>`;
  h+=complaintSection(ins)+trendSection(ins)+heatSection(ins)+unresolvedSection(ins);
  h+=`<div class="tablewrap"><table id="cTable"><thead><tr>
    <th class="l">날짜</th><th class="l">고객ID</th><th class="l">유형(대)</th><th class="l">유형(상세)</th>
    <th>처리(분)</th><th>해결</th><th class="l">AI요약</th><th class="l">원본대화</th></tr></thead><tbody id="cBody"></tbody></table></div>`;
  $("consultContent").innerHTML=h;
  applyConsultFilter();
}
function applyConsultFilter(){
  if(!consultData) return;
  const q=$("cSearch").value.trim().toLowerCase(), tf=$("cType").value;
  const body=$("cBody"); if(!body) return;
  const rows=consultData.rows.filter(r=>{
    if(tf && (r["문의유형(대분류)"]||"")!==tf) return false;
    if(!q) return true;
    return [(r["고객ID"]||""),(r["AI요약"]||""),(r["문의유형(대분류)"]||""),(r["문의유형(상세)"]||""),(r["원본대화"]||"")]
      .join(" ").toLowerCase().includes(q);
  });
  let h="";
  for(const r of rows){
    const ok=String(r["1차해결여부"]||"").toUpperCase();
    const okC=(ok==="O"||ok==="Y")?"ok-y":"ok-n";
    const raw=r["원본대화"]||"";
    h+=`<tr>
      <td class="l">${esc(r["날짜"])}</td>
      <td class="l"><span class="pill">${esc(r["고객ID"])}</span></td>
      <td class="l">${esc(r["문의유형(대분류)"])}</td>
      <td class="l">${esc(r["문의유형(상세)"])}</td>
      <td>${esc(r["처리시간(분)"])}</td>
      <td class="${okC}">${esc(r["1차해결여부"])||"—"}</td>
      <td class="ai">${esc(r["AI요약"])}</td>
      <td class="l">${raw?`<details class="raw"><summary>펼치기</summary><pre>${esc(raw)}</pre></details>`:'<span class="muted">—</span>'}</td>
    </tr>`;
  }
  body.innerHTML = h || `<tr><td colspan="8" class="nodata">조건에 맞는 상담이 없습니다.</td></tr>`;
}

$("logoutBtn").onclick=logout;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchView(t.dataset.view));
$("weeks").onchange=()=>loadMetrics(false);
$("mRefresh").onclick=()=>loadMetrics(true);
$("cLimit").onchange=()=>loadConsult(false);
$("cRefresh").onclick=()=>loadConsult(true);
$("cSent").onclick=fillSentiment;
$("cRange").onchange=()=>{ syncRangeInputs(); loadConsult(false); };
$("cApply").onclick=()=>loadConsult(false);
syncRangeInputs();
$("cSearch").addEventListener("input",applyConsultFilter);
$("cType").addEventListener("change",applyConsultFilter);

if(!localStorage.getItem(TOKEN_KEY)) goLogin();
else loadMetrics(false);
</script>
</body>
</html>
