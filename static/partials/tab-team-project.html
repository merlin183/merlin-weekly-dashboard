    <template x-if="activeTab === 'team-project'">
    <section x-transition class="space-y-4">
      <div class="flex gap-4 min-h-[60vh]">

        <!-- ── 왼쪽: 우선순위 목록 ── -->
        <div class="w-[260px] shrink-0 space-y-2">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-sm font-semibold text-slate-700">우선순위</h2>
            <button @click="addTeamPriority()" class="text-[10px] text-blue-500 hover:text-blue-700 font-medium">+ 순위 추가</button>
          </div>

          <template x-for="(tp, tpIdx) in (data.teamPriorities || [])" :key="tp.id">
            <div @click="selectedPriorityId = tp.id"
                 class="border rounded-xl p-3 cursor-pointer transition group"
                 :class="selectedPriorityId === tp.id ? 'border-blue-400 bg-blue-50 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'">
              <div class="flex items-center gap-2">
                <!-- 순위 배지 -->
                <span class="inline-flex items-center justify-center w-7 h-7 rounded-full text-xs font-bold shrink-0"
                      :class="tp.rank === 1 ? 'bg-red-100 text-red-700 border border-red-200' : tp.rank === 2 ? 'bg-orange-100 text-orange-700 border border-orange-200' : tp.rank === 3 ? 'bg-blue-100 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-600 border border-slate-200'"
                      x-text="tp.rank"></span>
                <!-- 라벨 -->
                <span class="text-sm font-medium text-slate-800" x-text="tp.label"></span>
                <!-- 프로젝트 수 -->
                <span class="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full ml-auto"
                      x-text="(tp.projectIds || []).length + '개'"></span>
              </div>
              <!-- 설명 (인라인 편집) -->
              <div class="mt-2" x-data="{ editing: false }">
                <template x-if="!editing">
                  <p @click.stop="editing = true"
                     class="text-[11px] leading-relaxed cursor-pointer hover:bg-white/50 rounded px-1 py-0.5 transition min-h-[20px]"
                     :class="tp.description ? 'text-slate-500' : 'text-slate-300 italic'"
                     x-text="tp.description || '설명을 입력하세요...'"></p>
                </template>
                <template x-if="editing">
                  <textarea x-model="tp.description" @blur="editing = false; save()" @keydown.ctrl.enter="editing = false; save()"
                            @click.stop
                            x-init="$nextTick(() => { $el.focus(); $el.style.height = $el.scrollHeight + 'px'; })"
                            class="w-full text-[11px] text-slate-600 bg-white border border-blue-200 rounded px-1.5 py-1 outline-none resize-none focus:ring-1 focus:ring-blue-300"></textarea>
                </template>
              </div>
              <!-- 순서 변경 / 삭제 (호버 시) -->
              <div class="flex items-center gap-1 mt-2 opacity-0 group-hover:opacity-100 transition">
                <button @click.stop="moveTeamPriority(tp.id, -1)" class="text-slate-300 hover:text-blue-500 text-xs" :class="tpIdx === 0 && 'invisible'">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
                </button>
                <button @click.stop="moveTeamPriority(tp.id, 1)" class="text-slate-300 hover:text-blue-500 text-xs" :class="tpIdx === (data.teamPriorities || []).length - 1 && 'invisible'">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <button @click.stop="removeTeamPriority(tp.id)" class="ml-auto text-slate-300 hover:text-red-400 text-[10px]">삭제</button>
              </div>
            </div>
          </template>

          <!-- 빈 상태 -->
          <div x-show="(data.teamPriorities || []).length === 0" class="text-center py-8 text-slate-400">
            <p class="text-sm">우선순위를 추가하세요</p>
            <button @click="addTeamPriority()" class="mt-2 px-3 py-1.5 text-xs bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">+ 첫 순위 추가</button>
          </div>
        </div>

        <!-- ── 오른쪽: 매핑된 프로젝트 ── -->
        <div class="flex-1 min-w-0">
          <!-- 선택된 순위가 없을 때 -->
          <div x-show="!selectedPriority" class="flex items-center justify-center h-full text-slate-400">
            <div class="text-center">
              <svg class="w-12 h-12 mx-auto mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
              </svg>
              <p class="text-sm">왼쪽에서 우선순위를 선택하세요</p>
            </div>
          </div>

          <!-- 선택된 순위 -->
          <div x-show="selectedPriority">
            <!-- 헤더 -->
            <div class="flex items-center gap-3 mb-4">
              <span class="inline-flex items-center justify-center w-8 h-8 rounded-full text-sm font-bold"
                    :class="selectedPriority?.rank === 1 ? 'bg-red-100 text-red-700' : selectedPriority?.rank === 2 ? 'bg-orange-100 text-orange-700' : selectedPriority?.rank === 3 ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'"
                    x-text="selectedPriority?.rank"></span>
              <div>
                <h2 class="text-sm font-semibold text-slate-800" x-text="selectedPriority?.label"></h2>
                <p class="text-[11px] text-slate-400" x-text="selectedPriority?.description || '설명 없음'"></p>
              </div>
              <span class="text-[10px] text-slate-400 ml-auto" x-text="selectedPriorityProjects.length + '개 프로젝트'"></span>
            </div>

            <!-- 프로젝트 목록 -->
            <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
              <template x-for="(proj, pIdx) in selectedPriorityProjects" :key="'tp-proj-' + proj.id">
                <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-50 last:border-b-0 hover:bg-slate-50 transition group">
                  <!-- 상태 배지 -->
                  <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium shrink-0"
                        :class="(proj.status || 'active') === 'active' ? 'bg-blue-100 text-blue-600' : (proj.status || 'active') === 'done' ? 'bg-emerald-100 text-emerald-600' : (proj.status || 'active') === 'hold' ? 'bg-amber-100 text-amber-600' : (proj.status || 'active') === 'waiting' ? 'bg-orange-100 text-orange-600' : 'bg-slate-100 text-slate-500'"
                        x-text="(proj.status || 'active') === 'active' ? '진행' : (proj.status || 'active') === 'done' ? '완료' : (proj.status || 'active') === 'hold' ? '보류' : (proj.status || 'active') === 'waiting' ? '대기' : proj.status"></span>
                  <!-- 제목 -->
                  <span class="flex-1 text-sm font-medium text-slate-700 truncate" x-text="proj.title"></span>
                  <!-- 담당자 -->
                  <span class="text-xs text-slate-500 shrink-0" x-text="proj.owner || ''"></span>
                  <!-- 완료일 -->
                  <span class="text-xs text-slate-400 tabular-nums w-16 text-right shrink-0" x-text="proj.completedDate || '-'"></span>
                  <!-- 소요기간 -->
                  <span class="text-[10px] w-14 text-right shrink-0"
                        :class="(proj.status || 'active') === 'done' ? 'text-emerald-600 font-medium' : 'text-slate-400'"
                        x-text="calcDuration(proj) || '-'"></span>
                  <!-- 연결 해제 -->
                  <button @click.stop="unlinkProjectFromPriority(proj.id)"
                          class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 text-xs transition shrink-0">&times;</button>
                </div>
              </template>

              <!-- 빈 상태 -->
              <div x-show="selectedPriorityProjects.length === 0" class="py-8 text-center text-slate-400">
                <p class="text-sm">연결된 프로젝트가 없습니다</p>
                <p class="text-xs mt-1">아래에서 프로젝트를 연결하세요</p>
              </div>
            </div>

            <!-- 프로젝트 연결 -->
            <div class="mt-3 relative" x-data="{ search: '' }">
              <button @click="tpLinkDropdown = !tpLinkDropdown"
                      class="px-3 py-2 text-xs text-blue-600 hover:text-blue-700 bg-blue-50 hover:bg-blue-100 rounded-lg transition font-medium w-full text-left">
                + 프로젝트 연결
              </button>
              <!-- 드롭다운 -->
              <div x-show="tpLinkDropdown" @click.outside="tpLinkDropdown = false" x-transition
                   class="absolute left-0 top-full mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-xl z-30 overflow-hidden">
                <div class="px-3 py-2 border-b border-slate-100">
                  <input x-model="search" placeholder="프로젝트 검색..." class="w-full text-xs px-2 py-1.5 border border-slate-200 rounded-lg outline-none focus:border-blue-400">
                </div>
                <div class="max-h-48 overflow-y-auto">
                  <template x-for="proj in unlinkedProjects.filter(p => !search || (p.title || '').toLowerCase().includes(search.toLowerCase()))" :key="'link-' + proj.id">
                    <div @click="linkProjectToPriority(proj.id); search = ''"
                         class="flex items-center gap-2 px-3 py-2 hover:bg-blue-50 cursor-pointer transition text-xs">
                      <span class="text-[10px] px-1 py-0.5 rounded-full font-medium shrink-0"
                            :class="(proj.status || 'active') === 'active' ? 'bg-blue-100 text-blue-600' : (proj.status || 'active') === 'done' ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-500'"
                            x-text="(proj.status || 'active') === 'active' ? '진행' : (proj.status || 'active') === 'done' ? '완료' : (proj.status || 'active') === 'hold' ? '보류' : '대기'"></span>
                      <span class="flex-1 text-slate-700 truncate" x-text="proj.title"></span>
                      <span class="text-slate-400 shrink-0" x-text="proj.owner || ''"></span>
                    </div>
                  </template>
                  <div x-show="unlinkedProjects.length === 0" class="px-3 py-4 text-center text-slate-400 text-xs">
                    모든 프로젝트가 연결되어 있습니다
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </section>
    </template>
