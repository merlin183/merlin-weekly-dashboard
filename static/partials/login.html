<div id="login-screen" style="display:none" class="fixed inset-0 bg-slate-100 z-[9999] flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm">
      <h1 class="text-lg font-bold text-slate-800 text-center mb-1">주간 업무 보고 대시보드</h1>
      <p class="text-xs text-slate-400 text-center mb-6">이메일과 비밀번호로 로그인하세요</p>
      <form id="login-form" class="space-y-4">
        <input id="login-email" type="email" placeholder="이메일" autocomplete="email"
               class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 text-sm">
        <input id="login-password" type="password" placeholder="비밀번호" autocomplete="current-password"
               class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 text-sm">
        <p id="login-error" class="text-xs text-red-500 hidden">이메일 또는 비밀번호가 올바르지 않습니다</p>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition font-medium text-sm">로그인</button>
      </form>
      <!-- 기존 비밀번호 전용 로그인 (하위 호환) -->
      <div class="mt-4 pt-4 border-t border-slate-100">
        <p class="text-[10px] text-slate-300 text-center cursor-pointer hover:text-slate-400" id="legacy-login-toggle">공용 비밀번호로 로그인</p>
        <form id="legacy-login-form" class="space-y-3 mt-3 hidden">
          <input id="legacy-password" type="password" placeholder="공용 비밀번호" autocomplete="current-password"
                 class="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 text-sm">
          <button type="submit" class="w-full py-2.5 bg-slate-500 hover:bg-slate-600 text-white rounded-xl transition font-medium text-xs">공용 로그인</button>
        </form>
      </div>
    </div>
  </div>
