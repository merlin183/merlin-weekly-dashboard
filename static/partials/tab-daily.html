    <template x-if="activeTab === 'daily'">
    <section x-transition class="space-y-6"
             x-init="if (!dailyDataLoaded) loadDailyData();">

      <!-- ── 프로젝트 계층 현황 (읽기 전용) ── -->
      <div class="bg-white border border-slate-200 rounded-2xl p-5">
        <div class="flex items-center gap-2 mb-4">
          <span class="text-xs font-bold text-indigo-600 uppercase tracking-widest">HIERARCHY</span>
          <h2 class="text-sm font-semibold text-slate-700">프로젝트 계층 현황</h2>
          <span class="text-[10px] text-slate-400">주간 리포트 탭에서 편집</span>
        </div>
        <div class="space-y-1">
          <!-- L1 -->
          <template x-for="node in projFilteredTree" :key="'dph1-' + node.id">
            <div class="border rounded-xl overflow-hidden"
                 :class="node._type === 'initiative' ? 'border-fuchsia-200' : 'border-slate-200'">
              <div @click="toggleInit('daily-ph-' + node.id)" class="flex flex-wrap items-center gap-2 px-4 py-3 cursor-pointer transition"
                   :class="node._type === 'initiative' ? 'hover:bg-fuchsia-50/30' : (isInitExpanded('daily-ph-' + node.id) ? 'bg-indigo-50/30' : 'hover:bg-indigo-50/30')">
                <span class="text-xs text-slate-400" x-text="isInitExpanded('daily-ph-' + node.id) ? '&#9660;' : '&#9654;'"></span>
                <template x-if="node._type === 'initiative'">
                  <span class="text-[10px] px-2 py-0.5 bg-fuchsia-100 text-fuchsia-700 rounded font-bold shrink-0">Initiative</span>
                </template>
                <template x-if="node._type !== 'initiative'">
                  <span class="inline-block w-2.5 h-2.5 rounded-full shrink-0" :class="projHealthDot(node.health)" :title="projHealthLabel(node.health)"></span>
                </template>
                <span class="text-sm font-bold" :class="node._type === 'initiative' ? 'text-fuchsia-800' : 'text-slate-800'" x-text="node.name"></span>
                <span x-show="node.lead" class="text-[10px] text-slate-400" x-text="node.lead"></span>
                <span x-show="node.state" class="text-[10px] px-1.5 py-0.5 rounded-full font-medium"
                      :class="projStateBadge(node.state)" x-text="projStateLabel(node.state)"></span>
                <span class="text-[10px] text-slate-400 ml-auto" x-text="(node.children||[]).length > 0 ? (node.children.length + '&#44060; &#54616;&#50948;') : ''"></span>
                <!-- Phase 2: 의존성 표시 -->
                <div class="w-full" x-show="false && (node.blocks||[]).length > 0 || (node.blockedBy||[]).length > 0">
                  <p x-show="false && (node.blocks||[]).length > 0" class="text-[10px] text-orange-500 ml-5" x-text="projBlocksText(node.blocks)"></p>
                  <p x-show="(node.blockedBy||[]).length > 0" class="text-[10px] text-red-500 ml-5" x-text="projBlockedByText(node.blockedBy)"></p>
                </div>
              </div>
              <div x-show="isInitExpanded('daily-ph-' + node.id)" x-transition class="border-t border-slate-100">
                <div x-show="false && node.description" class="px-4 py-2 bg-indigo-50/20">
                  <p class="text-xs text-slate-600 whitespace-pre-wrap" x-text="node.description"></p>
                </div>
                <!-- Phase 3: 최근 업데이트 -->
                <div x-show="false && node.latestUpdate" class="px-4 py-2 bg-blue-50/30 border-t border-blue-100/50">
                  <p class="text-[10px] text-blue-500 font-medium mb-0.5">최근 업데이트 <span class="text-blue-400 font-normal" x-text="formatUpdateDate(node.latestUpdate?.createdAt)"></span></p>
                  <p class="text-xs text-slate-600 whitespace-pre-wrap line-clamp-3" x-text="node.latestUpdate?.body"></p>
                </div>
                <!-- L2 -->
                <template x-for="child in (node.children || [])" :key="'dph2-' + child.id">
                  <div class="border-b border-slate-50">
                    <div @click="toggleInit('daily-ph-' + child.id)" class="flex flex-wrap items-center gap-2 px-4 py-2 pl-10 cursor-pointer hover:bg-slate-50 transition">
                      <span class="text-xs text-slate-400" x-text="isInitExpanded('daily-ph-' + child.id) ? '&#9660;' : '&#9654;'"></span>
                      <!-- Phase 3: Health 도트 -->
                      <span class="inline-block w-2 h-2 rounded-full shrink-0" :class="projHealthDot(child.health)" :title="projHealthLabel(child.health)"></span>
                      <span class="text-xs font-medium text-slate-700" x-text="child.name"></span>
                      <span x-show="child.lead" class="text-[10px] text-slate-400" x-text="child.lead"></span>
                      <span x-show="child.state" class="text-[10px] px-1.5 py-0.5 rounded-full font-medium"
                            :class="projStateBadge(child.state)" x-text="projStateLabel(child.state)"></span>
                      <!-- Phase 2: 의존성 표시 -->
                      <div class="w-full" x-show="false && (child.blocks||[]).length > 0 || (child.blockedBy||[]).length > 0">
                        <p x-show="false && (child.blocks||[]).length > 0" class="text-[10px] text-orange-500 ml-5" x-text="projBlocksText(child.blocks)"></p>
                        <p x-show="(child.blockedBy||[]).length > 0" class="text-[10px] text-red-500 ml-5" x-text="projBlockedByText(child.blockedBy)"></p>
                      </div>
                    </div>
                    <div x-show="isInitExpanded('daily-ph-' + child.id)" x-transition>
                      <div x-show="false && child.description" class="px-4 py-2 pl-14 bg-slate-50/50">
                        <p class="text-xs text-slate-600 whitespace-pre-wrap" x-text="child.description"></p>
                      </div>
                      <!-- Phase 3: 최근 업데이트 -->
                      <div x-show="false && child.latestUpdate" class="px-4 py-2 pl-14 bg-blue-50/30 border-t border-blue-100/50">
                        <p class="text-[10px] text-blue-500 font-medium mb-0.5">최근 업데이트 <span class="text-blue-400 font-normal" x-text="formatUpdateDate(child.latestUpdate?.createdAt)"></span></p>
                        <p class="text-xs text-slate-600 whitespace-pre-wrap line-clamp-3" x-text="child.latestUpdate?.body"></p>
                      </div>
                      <!-- L3 -->
                      <template x-for="gc in (child.children || [])" :key="'dph3-' + gc.id">
                        <div class="border-t border-slate-50">
                          <div class="flex flex-wrap items-center gap-2 px-4 py-2 pl-16 hover:bg-slate-50 transition">
                            <!-- Phase 3: Health 도트 -->
                            <span class="inline-block w-2 h-2 rounded-full shrink-0" :class="projHealthDot(gc.health)" :title="projHealthLabel(gc.health)"></span>
                            <span class="text-xs text-slate-600" x-text="gc.name"></span>
                            <span x-show="gc.state" class="text-[10px] px-1.5 py-0.5 rounded-full font-medium"
                                  :class="projStateBadge(gc.state)" x-text="projStateLabel(gc.state)"></span>
                            <!-- Phase 2: 의존성 표시 -->
                            <div class="w-full" x-show="false && (gc.blocks||[]).length > 0 || (gc.blockedBy||[]).length > 0">
                              <p x-show="false && (gc.blocks||[]).length > 0" class="text-[10px] text-orange-500 ml-3" x-text="projBlocksText(gc.blocks)"></p>
                              <p x-show="(gc.blockedBy||[]).length > 0" class="text-[10px] text-red-500 ml-3" x-text="projBlockedByText(gc.blockedBy)"></p>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
                <div x-show="(node.children||[]).length === 0" class="px-4 py-3 text-[10px] text-slate-400 pl-10">하위 프로젝트 없음</div>
              </div>
            </div>
          </template>
          <div x-show="projHierarchy.tree.length === 0" class="text-center py-6 text-slate-400">
            <p class="text-sm">등록된 프로젝트 계층이 없습니다</p>
            <p class="text-xs mt-1">주간 리포트 탭에서 프로젝트 계층을 설정하세요</p>
          </div>
        </div>
      </div>

      <!-- ── Linear 사이클 ── -->
      <div class="bg-white border border-slate-200 rounded-2xl p-5" x-data="{
        cycleData: [], cycleLoading: false, cycleOpen: true, cycleFilter: 'active',
        async loadCycles() {
          this.cycleLoading = true;
          try {
            const res = await _authFetch(location.origin + '/api/linear/cycles');
            if (res.ok) this.cycleData = (await res.json()).cycles || [];
          } catch (e) { console.error('사이클 로드 실패:', e); } finally { this.cycleLoading = false; }
        },
        filteredByAssignee(byAssignee) {
          const result = {};
          // 사이클에 있는 담당자
          for (const [assignee, issues] of Object.entries(byAssignee)) {
            if (!this.cycleFilter) {
              result[assignee] = issues;
            } else {
              result[assignee] = issues.filter(i => {
                if (this.cycleFilter === 'active') return i.stateType !== 'completed' && i.stateType !== 'cancelled';
                if (this.cycleFilter === 'in_progress') return i.stateType === 'started';
                return true;
              });
            }
          }
          // 사이클에 없는 팀원도 표시 (설정된 빈 카드 제외 대상 적용)
          const exclude = new Set(teamConfig?.dailyOwnerExcludeNames || []);
          const members = (typeof teamConfig !== 'undefined' && teamConfig?.members) || [];
          members.forEach(m => { if (!result[m] && !exclude.has(m)) result[m] = []; });
          return result;
        }
      }" x-init="loadCycles()">
        <div class="flex items-center gap-2 mb-3">
          <button @click="cycleOpen = !cycleOpen" class="text-xs text-slate-400">
            <span x-text="cycleOpen ? '▼' : '▶'"></span>
          </button>
          <span class="text-xs font-bold text-teal-600 uppercase tracking-widest">CYCLE</span>
          <h2 class="text-sm font-semibold text-slate-700 cursor-pointer" @click="cycleOpen = !cycleOpen">이번 주 사이클</h2>
          <!-- 상태 필터 -->
          <div class="flex gap-1 ml-2">
            <button @click="cycleFilter = ''" class="px-2 py-0.5 text-[10px] rounded-md border transition font-medium"
                    :class="!cycleFilter ? 'bg-slate-200 text-slate-700 border-slate-300' : 'bg-white text-slate-400 border-slate-200'">전체</button>
            <button @click="cycleFilter = 'active'" class="px-2 py-0.5 text-[10px] rounded-md border transition font-medium"
                    :class="cycleFilter === 'active' ? 'bg-teal-100 text-teal-700 border-teal-200' : 'bg-white text-slate-400 border-slate-200'">미완료</button>
            <button @click="cycleFilter = 'in_progress'" class="px-2 py-0.5 text-[10px] rounded-md border transition font-medium"
                    :class="cycleFilter === 'in_progress' ? 'bg-blue-100 text-blue-700 border-blue-200' : 'bg-white text-slate-400 border-slate-200'">진행 중</button>
          </div>
          <button @click="loadCycles()" :disabled="cycleLoading"
                  class="text-[10px] px-2 py-0.5 rounded-lg border transition font-medium ml-2"
                  :class="cycleLoading ? 'bg-slate-100 text-slate-400 border-slate-200' : 'bg-teal-50 text-teal-600 border-teal-200 hover:bg-teal-100'"
                  x-text="cycleLoading ? '로딩...' : '↻ 새로고침'"></button>
        </div>

        <div x-show="cycleOpen" x-transition>
          <template x-for="cycle in cycleData" :key="'cy-' + cycle.id">
            <div class="mb-4">
              <!-- 사이클 헤더 -->
              <div class="flex items-center gap-3 mb-3 p-3 bg-teal-50/50 rounded-xl">
                <span class="text-sm font-bold text-teal-800" x-text="cycle.name"></span>
                <span class="text-[10px] text-teal-600" x-text="cycle.startsAt + ' ~ ' + cycle.endsAt"></span>
                <div class="flex items-center gap-2 ml-auto">
                  <div class="w-20 h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-teal-500 rounded-full transition-all" :style="'width:' + cycle.progress + '%'"></div>
                  </div>
                  <span class="text-[10px] font-bold text-teal-700" x-text="cycle.progress + '%'"></span>
                </div>
                <span class="text-[10px] text-slate-400" x-text="'완료 ' + cycle.done + '/' + cycle.total"></span>
              </div>

              <!-- 인원별 > Initiative > Project > Issue > 하위 Issue -->
              <div class="space-y-2">
                <template x-for="(issues, assignee) in filteredByAssignee(cycle.byAssignee)" :key="'cya-' + cycle.id + '-' + assignee">
                  <div class="border border-slate-200 rounded-lg overflow-hidden" x-data="{ open: false }">
                    <!-- 담당자 헤더 -->
                    <div @click="open = !open" class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-slate-50 transition">
                      <span class="inline-flex items-center justify-center w-6 h-6 bg-teal-100 text-teal-600 rounded-full text-[10px] font-bold" x-text="assignee.charAt(0)"></span>
                      <span class="text-xs font-medium text-slate-700" x-text="assignee"></span>
                      <span class="text-[10px] text-slate-400" x-text="issues.length + '건'"></span>
                      <span x-show="issues.length === 0" class="text-[10px] px-1.5 py-0.5 bg-slate-50 text-slate-400 rounded-full">해당 없음</span>
                      <span x-show="issues.filter(i => i.stateType === 'completed').length > 0"
                            class="text-[10px] px-1.5 py-0.5 bg-emerald-50 text-emerald-600 rounded-full"
                            x-text="'완료 ' + issues.filter(i => i.stateType === 'completed').length"></span>
                      <span x-show="issues.filter(i => i.stateType === 'started').length > 0"
                            class="text-[10px] px-1.5 py-0.5 bg-blue-50 text-blue-600 rounded-full"
                            x-text="'진행 ' + issues.filter(i => i.stateType === 'started').length"></span>
                      <span x-show="issues.filter(i => i.stateType === 'unstarted' || i.stateType === 'backlog' || i.stateType === 'triage').length > 0"
                            class="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full"
                            x-text="'대기 ' + issues.filter(i => i.stateType === 'unstarted' || i.stateType === 'backlog' || i.stateType === 'triage').length"></span>
                      <svg class="w-3 h-3 text-slate-400 ml-auto transition-transform" :class="open && 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                      </svg>
                    </div>
                    <!-- 펼침: Initiative > Project > Issue 계층 -->
                    <div x-show="open" x-transition class="border-t border-slate-100" x-data="{
                      get issueTree() {
                        const tree = {};
                        (issues || []).filter(i => !i.parentId).forEach(i => {
                          const init = i.initiative || '(Initiative 없음)';
                          const proj = i.project || '(프로젝트 없음)';
                          if (!tree[init]) tree[init] = {};
                          if (!tree[init][proj]) tree[init][proj] = [];
                          tree[init][proj].push(i);
                        });
                        return tree;
                      }
                    }">
                      <template x-for="(projects, initName) in issueTree" :key="'cyat-' + assignee + '-' + initName">
                        <div x-data="{ initOpen: true }">
                          <!-- Initiative -->
                          <div @click="initOpen = !initOpen" class="flex items-center gap-2 px-3 py-1.5 pl-6 cursor-pointer hover:bg-fuchsia-50/30 transition border-b border-slate-50">
                            <span class="text-[10px] text-slate-400" x-text="initOpen ? '▼' : '▶'"></span>
                            <span class="text-[9px] px-1.5 py-0.5 bg-fuchsia-100 text-fuchsia-700 rounded font-bold">Initiative</span>
                            <span class="text-[11px] text-fuchsia-800" x-text="initName"></span>
                          </div>
                          <div x-show="initOpen" x-transition>
                            <template x-for="(projIssues, projName) in projects" :key="'cyap-' + assignee + '-' + projName">
                              <div x-data="{ projOpen: true }">
                                <!-- Project -->
                                <div @click="projOpen = !projOpen" class="flex items-center gap-2 px-3 py-1.5 pl-10 cursor-pointer hover:bg-violet-50/30 transition border-b border-slate-50">
                                  <span class="text-[10px] text-slate-400" x-text="projOpen ? '▼' : '▶'"></span>
                                  <span class="text-[9px] px-1.5 py-0.5 bg-violet-100 text-violet-700 rounded font-bold">Project</span>
                                  <span class="text-[11px] text-violet-800" x-text="projName"></span>
                                  <span class="text-[10px] text-slate-400 ml-auto" x-text="projIssues.length + '건'"></span>
                                </div>
                                <div x-show="projOpen" x-transition>
                                  <template x-for="issue in projIssues" :key="'cyai-' + issue.id">
                                    <div>
                                      <!-- Issue -->
                                      <div class="flex items-center gap-2 px-3 py-1.5 pl-16 text-xs border-b border-slate-50 hover:bg-slate-50">
                                        <span class="text-[10px] font-mono text-teal-500 w-16 shrink-0" x-text="issue.identifier"></span>
                                        <span class="flex-1 text-slate-700" x-text="issue.title"></span>
                                        <span class="text-[10px] px-1.5 py-0.5 rounded-full shrink-0"
                                              :class="{'bg-blue-50 text-blue-600': issue.stateType==='started', 'bg-emerald-50 text-emerald-600': issue.stateType==='completed', 'bg-slate-100 text-slate-500': issue.stateType==='backlog'||issue.stateType==='unstarted'}"
                                              x-text="issue.state"></span>
                                      </div>
                                      <!-- 하위 Issue -->
                                      <template x-for="child in (issue.children || [])" :key="'cyac-' + child.id">
                                        <div class="flex items-center gap-2 px-3 py-1 pl-20 text-xs border-b border-slate-50 hover:bg-slate-50 bg-slate-50/50">
                                          <span class="text-[10px] text-slate-300">└</span>
                                          <span class="text-[10px] font-mono text-slate-400 w-16 shrink-0" x-text="child.identifier"></span>
                                          <span class="flex-1 text-slate-600" x-text="child.title"></span>
                                          <span class="text-[10px] px-1.5 py-0.5 rounded-full shrink-0"
                                                :class="{'bg-blue-50 text-blue-600': child.stateType==='started', 'bg-emerald-50 text-emerald-600': child.stateType==='completed', 'bg-slate-100 text-slate-500': child.stateType==='backlog'||child.stateType==='unstarted'}"
                                                x-text="child.state"></span>
                                        </div>
                                      </template>
                                    </div>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <div x-show="cycleData.length === 0 && !cycleLoading" class="text-center py-4 text-xs text-slate-400">활성 사이클이 없습니다</div>
          <div x-show="cycleLoading" class="text-center py-4 text-xs text-slate-400">사이클 로딩 중...</div>
        </div>
      </div>

      <!-- ── 담당자별 프로젝트 테이블 ── -->
      <div class="bg-white border border-slate-200 rounded-2xl p-5">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xs font-bold text-blue-600 uppercase tracking-widest">PRJ</span>
          <h2 class="text-sm font-semibold text-slate-700">이번 주 집중 프로젝트</h2>
          <button @click="loadDailyData()" :disabled="dailyDataLoading"
                  class="text-[10px] px-2 py-0.5 rounded-lg border transition font-medium ml-2"
                  :class="dailyDataLoading ? 'bg-slate-100 text-slate-400 border-slate-200' : 'bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-100'"
                  x-text="dailyDataLoading ? '로딩...' : '↻ Linear 새로고침'"></button>
          <span class="text-[10px] text-slate-400 ml-auto" x-text="dailyTotalCount + '개 표시'"></span>
        </div>

        <!-- 필터 바 -->
        <div class="flex flex-wrap items-center gap-2 mb-4 p-3 bg-slate-50 rounded-xl" x-data="{ showDateFilter: false }">
          <!-- 상태 토글 버튼 -->
          <span class="text-[10px] text-slate-400 font-medium mr-1">상태:</span>
          <button @click="dailyFilter.excludeDone = !dailyFilter.excludeDone"
                  class="px-2.5 py-1 text-[10px] rounded-lg border transition font-medium"
                  :class="!dailyFilter.excludeDone ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-white text-slate-400 border-slate-200 line-through'">
            완료 <span class="font-normal" x-text="'(' + dailyStatusCounts().done + ')'"></span>
          </button>
          <button @click="dailyFilter.excludeHold = !dailyFilter.excludeHold"
                  class="px-2.5 py-1 text-[10px] rounded-lg border transition font-medium"
                  :class="!dailyFilter.excludeHold ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-white text-slate-400 border-slate-200 line-through'">
            보류 <span class="font-normal" x-text="'(' + dailyStatusCounts().hold + ')'"></span>
          </button>
          <button @click="dailyFilter.excludeWaiting = !dailyFilter.excludeWaiting"
                  class="px-2.5 py-1 text-[10px] rounded-lg border transition font-medium"
                  :class="!dailyFilter.excludeWaiting ? 'bg-orange-100 text-orange-700 border-orange-200' : 'bg-white text-slate-400 border-slate-200 line-through'">
            대기 <span class="font-normal" x-text="'(' + dailyStatusCounts().waiting + ')'"></span>
          </button>
          <span class="text-[10px] px-2.5 py-1 bg-blue-100 text-blue-700 border border-blue-200 rounded-lg font-medium">
            진행 <span class="font-normal" x-text="'(' + dailyStatusCounts().active + ')'"></span>
          </span>

          <!-- 날짜 필터 토글 -->
          <div class="ml-auto flex items-center gap-1.5">
            <button @click="showDateFilter = !showDateFilter"
                    class="px-2 py-1 text-[10px] rounded-lg border transition"
                    :class="showDateFilter || dailyFilter.completedAfter || dailyFilter.completedBefore ? 'bg-violet-100 text-violet-600 border-violet-200' : 'bg-white text-slate-400 border-slate-200 hover:border-violet-200'">
              완료일 필터
            </button>
            <button x-show="dailyFilter.completedAfter || dailyFilter.completedBefore || dailyFilter.excludeHold || dailyFilter.excludeWaiting || !dailyFilter.excludeDone"
                    @click="dailyFilter.excludeDone = true; dailyFilter.excludeHold = false; dailyFilter.excludeWaiting = false; dailyFilter.completedAfter = ''; dailyFilter.completedBefore = '';"
                    class="px-2 py-1 text-[10px] text-slate-400 hover:text-red-500 rounded-lg border border-slate-200 hover:border-red-200 transition">
              초기화
            </button>
          </div>

          <!-- 완료일 범위 (펼침) -->
          <div x-show="showDateFilter" x-transition class="w-full flex items-center gap-2 mt-2 pt-2 border-t border-slate-200">
            <span class="text-[10px] text-slate-400 font-medium">완료일:</span>
            <input type="text" x-model="dailyFilter.completedAfter" placeholder="이후 (예: 3/17)"
                   class="px-2 py-1 text-[10px] border border-slate-200 rounded-lg outline-none focus:border-violet-400 bg-white w-24">
            <span class="text-[10px] text-slate-400">~</span>
            <input type="text" x-model="dailyFilter.completedBefore" placeholder="이전 (예: 3/25)"
                   class="px-2 py-1 text-[10px] border border-slate-200 rounded-lg outline-none focus:border-violet-400 bg-white w-24">
            <span class="text-[10px] text-slate-400">완료일 형식에 맞춰 입력</span>
          </div>
        </div>

        <!-- 담당자 드롭다운 목록 -->
        <div class="space-y-1">
          <template x-for="owner in visibleProfiles(dailyOwnerNames)" :key="'daily-owner-' + owner">
            <div class="border border-slate-200 rounded-xl overflow-hidden">
              <!-- 담당자 헤더 (클릭하여 펼침) -->
              <div @click="toggleDailyOwner(owner)"
                   class="flex items-center gap-3 px-4 py-3 cursor-pointer hover:bg-slate-50 transition"
                   :class="dailyExpandedOwner === owner ? 'bg-slate-50' : ''">
                <span class="inline-flex items-center justify-center w-7 h-7 bg-blue-100 text-blue-600 rounded-full text-xs font-bold" x-text="owner.charAt(0)"></span>
                <span class="text-sm font-medium text-slate-800" x-text="owner"></span>
                <span class="text-[10px] px-1.5 py-0.5 rounded-full font-bold border"
                      :class="dailyOwnerStatus(owner).cls"
                      x-text="dailyOwnerStatus(owner).label"></span>
                <span class="text-[10px] px-2 py-0.5 bg-slate-100 text-slate-500 rounded-full" x-text="(dailyOwners[owner] || []).length + '개 프로젝트'"></span>
                <svg class="w-4 h-4 text-slate-400 ml-auto transition-transform" :class="dailyExpandedOwner === owner ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>

              <!-- 프로젝트 목록 + 댓글 (펼침 시) -->
              <div x-show="dailyExpandedOwner === owner" x-transition x-init="$watch('dailyExpandedOwner', v => { if (v === owner) loadComments(owner); })" class="border-t border-slate-100">

                <!-- ── Initiative > Project > Todo (담당자별 필터) ── -->
                <div x-data="{ ownerInit: initForOwner(owner) }" x-effect="ownerInit = initForOwner(owner)">
                  <!-- Initiative 목록 -->
                  <template x-for="init in ownerInit.initiatives" :key="'oi-' + owner + '-' + init.id">
                    <div class="border-b border-slate-100">
                      <div @click="toggleInit(owner + '-' + init.id)" class="flex items-center gap-2 px-4 py-2.5 cursor-pointer hover:bg-fuchsia-50/50 transition"
                           :class="isInitExpanded(owner + '-' + init.id) ? 'bg-fuchsia-50/30' : ''">
                        <span class="text-xs text-slate-400" x-text="isInitExpanded(owner + '-' + init.id) ? '▼' : '▶'"></span>
                        <span class="text-[10px] px-1.5 py-0.5 bg-fuchsia-100 text-fuchsia-700 rounded font-bold">Initiative</span>
                        <span class="text-xs font-bold text-slate-800" x-text="init.name"></span>
                        <div class="w-16 h-1.5 bg-slate-200 rounded-full overflow-hidden ml-auto"><div class="h-full bg-fuchsia-500 rounded-full" :style="'width:' + init.progress + '%'"></div></div>
                        <span class="text-[10px] text-slate-400" x-text="init.progress + '%'"></span>
                        <template x-if="init.targetDate && dueDayTag(init.targetDate)">
                          <span class="text-[10px] px-1.5 py-0.5 rounded font-semibold" :class="dueDayTag(init.targetDate).cls" x-text="dueDayTag(init.targetDate).text"></span>
                        </template>
                      </div>
                      <div x-show="isInitExpanded(owner + '-' + init.id)" x-transition>
                        <template x-for="proj in init.projects" :key="'oip-' + owner + '-' + proj.id">
                          <div>
                            <div @click="toggleInit(owner + '-p-' + proj.id)" class="flex items-center gap-2 px-4 py-2 pl-10 cursor-pointer hover:bg-violet-50/50 transition border-b border-slate-50">
                              <span class="text-xs text-slate-400" x-text="isInitExpanded(owner + '-p-' + proj.id) ? '▼' : '▶'"></span>
                              <span class="text-[10px] px-1.5 py-0.5 bg-violet-100 text-violet-700 rounded font-bold">Project</span>
                              <span class="text-xs font-medium text-slate-700" x-text="proj.name"></span>
                              <div class="w-14 h-1.5 bg-slate-200 rounded-full overflow-hidden ml-auto"><div class="h-full bg-violet-500 rounded-full" :style="'width:' + proj.progress + '%'"></div></div>
                              <span class="text-[10px] text-slate-400" x-text="proj.done + '/' + proj.total"></span>
                              <template x-if="proj.targetDate && dueDayTag(proj.targetDate)">
                                <span class="text-[10px] px-1.5 py-0.5 rounded font-semibold" :class="dueDayTag(proj.targetDate).cls" x-text="dueDayTag(proj.targetDate).text"></span>
                              </template>
                            </div>
                            <div x-show="isInitExpanded(owner + '-p-' + proj.id)" x-transition>
                              <template x-for="issue in proj.issues" :key="'oii-' + issue.id">
                                <div class="flex items-center gap-2 px-4 py-2 pl-16 text-sm border-b border-slate-50 hover:bg-slate-50 transition">
                                  <span class="text-[10px] text-slate-400 font-mono w-14 shrink-0" x-text="issue.identifier"></span>
                                  <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium shrink-0"
                                        :class="issue.stateType === 'completed' ? 'bg-emerald-100 text-emerald-700' : issue.stateType === 'started' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'"
                                        x-text="issue.state"></span>
                                  <span class="flex-1" :class="issue.stateType === 'completed' ? 'text-slate-400 line-through' : 'text-slate-700'" x-text="issue.title"></span>
                                  <template x-if="initDueDateEdit !== issue.id">
                                    <span class="flex items-center gap-1 shrink-0">
                                      <template x-if="issue.dueDate && dueDayTag(issue.dueDate)"><span class="text-[10px] px-1.5 py-0.5 rounded font-semibold" :class="dueDayTag(issue.dueDate).cls" x-text="dueDayTag(issue.dueDate).text"></span></template>
                                      <button @click.stop="startDueDateEdit(issue.id, issue.dueDate)" class="text-[10px] text-slate-300 hover:text-violet-500 transition">📅</button>
                                    </span>
                                  </template>
                                  <template x-if="initDueDateEdit === issue.id">
                                    <span class="flex items-center gap-1 shrink-0" @click.stop>
                                      <input type="date" x-model="initDueDateValue" class="px-1 py-0.5 text-[10px] border border-violet-300 rounded outline-none w-28">
                                      <button @click="saveDueDate(issue.id)" class="text-[10px] px-1.5 py-0.5 bg-violet-600 text-white rounded font-medium">저장</button>
                                      <button @click="initDueDateEdit = null" class="text-[10px] text-slate-400">취소</button>
                                    </span>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Initiative 미배정 -->
                  <template x-for="proj in ownerInit.unassigned" :key="'ou-' + owner + '-' + proj.id">
                    <div class="border-b border-slate-100">
                      <div @click="toggleInit(owner + '-p-' + proj.id)" class="flex items-center gap-2 px-4 py-2.5 cursor-pointer hover:bg-slate-50 transition">
                        <span class="text-xs text-slate-400" x-text="isInitExpanded(owner + '-p-' + proj.id) ? '▼' : '▶'"></span>
                        <span class="text-[10px] px-1.5 py-0.5 bg-slate-200 text-slate-600 rounded font-bold">Project</span>
                        <span class="text-xs font-medium text-slate-700" x-text="proj.name"></span>
                        <div class="w-14 h-1.5 bg-slate-200 rounded-full overflow-hidden ml-auto"><div class="h-full bg-slate-400 rounded-full" :style="'width:' + proj.progress + '%'"></div></div>
                        <span class="text-[10px] text-slate-400" x-text="proj.done + '/' + proj.total"></span>
                      </div>
                      <div x-show="isInitExpanded(owner + '-p-' + proj.id)" x-transition>
                        <template x-for="issue in proj.issues" :key="'oui-' + issue.id">
                          <div class="flex items-center gap-2 px-4 py-2 pl-10 text-sm border-b border-slate-50 hover:bg-slate-50 transition">
                            <span class="text-[10px] text-slate-400 font-mono w-14 shrink-0" x-text="issue.identifier"></span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium shrink-0"
                                  :class="issue.stateType === 'completed' ? 'bg-emerald-100 text-emerald-700' : issue.stateType === 'started' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'"
                                  x-text="issue.state"></span>
                            <span class="flex-1" :class="issue.stateType === 'completed' ? 'text-slate-400 line-through' : 'text-slate-700'" x-text="issue.title"></span>
                            <template x-if="initDueDateEdit !== issue.id">
                              <span class="flex items-center gap-1 shrink-0">
                                <template x-if="issue.dueDate && dueDayTag(issue.dueDate)"><span class="text-[10px] px-1.5 py-0.5 rounded font-semibold" :class="dueDayTag(issue.dueDate).cls" x-text="dueDayTag(issue.dueDate).text"></span></template>
                                <button @click.stop="startDueDateEdit(issue.id, issue.dueDate)" class="text-[10px] text-slate-300 hover:text-violet-500 transition">📅</button>
                              </span>
                            </template>
                            <template x-if="initDueDateEdit === issue.id">
                              <span class="flex items-center gap-1 shrink-0" @click.stop>
                                <input type="date" x-model="initDueDateValue" class="px-1 py-0.5 text-[10px] border border-violet-300 rounded outline-none w-28">
                                <button @click="saveDueDate(issue.id)" class="text-[10px] px-1.5 py-0.5 bg-violet-600 text-white rounded font-medium">저장</button>
                                <button @click="initDueDateEdit = null" class="text-[10px] text-slate-400">취소</button>
                              </span>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- 마감일 없음 / Backlog -->
                  <div x-show="ownerInit.noDueDate.length > 0 || ownerInit.backlog.length > 0" class="border-b border-slate-100">
                    <div @click="toggleInit(owner + '-unsched')" class="flex items-center gap-2 px-4 py-2 bg-amber-50/50 cursor-pointer hover:bg-amber-50 transition">
                      <span class="text-xs text-amber-500" x-text="isInitExpanded(owner + '-unsched') ? '▼' : '▶'"></span>
                      <span class="text-[10px] font-bold text-amber-700">마감일 없음 / Backlog</span>
                      <span class="text-[10px] text-amber-400 ml-auto" x-text="ownerInit.noDueDate.length + ownerInit.backlog.length + '건'"></span>
                    </div>
                    <div x-show="isInitExpanded(owner + '-unsched')" x-transition>
                      <template x-for="issue in ownerInit.noDueDate" :key="'ond-' + issue.id">
                        <div class="flex items-center gap-2 px-4 py-2 pl-10 text-sm border-b border-slate-50 hover:bg-amber-50/30 transition">
                          <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium shrink-0"
                                :class="issue.stateType === 'started' ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'"
                                x-text="issue.state"></span>
                          <span class="flex-1 text-slate-700 text-xs" x-text="issue.title"></span>
                          <span class="text-[10px] text-slate-400 shrink-0" x-text="issue.project"></span>
                          <template x-if="initDueDateEdit !== issue.id">
                            <button @click.stop="startDueDateEdit(issue.id, '')" class="text-[10px] px-2 py-0.5 border border-amber-200 text-amber-600 rounded hover:bg-amber-50 transition">날짜 설정</button>
                          </template>
                          <template x-if="initDueDateEdit === issue.id">
                            <span class="flex items-center gap-1 shrink-0" @click.stop>
                              <input type="date" x-model="initDueDateValue" class="px-1 py-0.5 text-[10px] border border-violet-300 rounded outline-none w-28">
                              <button @click="saveDueDate(issue.id)" class="text-[10px] px-1.5 py-0.5 bg-violet-600 text-white rounded font-medium">저장</button>
                              <button @click="initDueDateEdit = null" class="text-[10px] text-slate-400">취소</button>
                            </span>
                          </template>
                        </div>
                      </template>
                      <template x-for="issue in ownerInit.backlog" :key="'obl-' + issue.id">
                        <div class="flex items-center gap-2 px-4 py-2 pl-10 text-sm border-b border-slate-50">
                          <span class="text-[10px] px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-full font-medium shrink-0">Backlog</span>
                          <span class="flex-1 text-slate-600 text-xs" x-text="issue.title"></span>
                          <span class="text-[10px] text-slate-400 shrink-0" x-text="issue.project"></span>
                        </div>
                      </template>
                    </div>
                  </div>

                  <div x-show="ownerInit.initiatives.length === 0 && ownerInit.unassigned.length === 0 && ownerInit.noDueDate.length === 0 && ownerInit.backlog.length === 0 && dailyDataLoaded"
                       class="px-4 py-3 text-[10px] text-slate-400 border-b border-slate-100">배정된 이슈가 없습니다</div>
                </div>

                <!-- ① 어제 작업한 일 / 완료된 일 -->
                <div>
                  <div class="flex items-center gap-2 px-4 py-2 bg-emerald-50 border-b border-emerald-100">
                    <span class="text-[11px] font-bold text-emerald-700">어제 작업한 일 / 완료된 일</span>
                    <span class="text-[10px] text-emerald-400 ml-auto" x-text="(dailyCompletedYesterday[owner] || []).length + '건'"></span>
                  </div>
                  <template x-for="issue in (dailyCompletedYesterday[owner] || [])" :key="'cy-' + issue.identifier">
                    <div class="flex items-center gap-3 px-4 py-2 text-sm border-b border-slate-50">
                      <span class="text-[10px] text-slate-400 font-mono w-14 shrink-0" x-text="issue.identifier"></span>
                      <span class="flex-1 text-slate-700" x-text="issue.title"></span>
                      <span class="text-emerald-500 text-xs">✅</span>
                      <span x-show="issue.project" class="text-[10px] text-slate-400 shrink-0" x-text="issue.project"></span>
                    </div>
                  </template>
                  <div x-show="(dailyCompletedYesterday[owner] || []).length === 0 && dailyDataLoaded" class="px-4 py-2 text-[10px] text-slate-400 border-b border-slate-50">
                    최근 완료된 이슈 없음
                  </div>
                </div>

                <!-- ② 기타 (메모) -->
                <div class="px-4 py-3 bg-slate-50 border-b border-slate-100"
                     x-init="if (!data.dailyMemos) data.dailyMemos = {}; if (!data.dailyMemos[owner]) data.dailyMemos[owner] = '';">
                  <div class="text-[11px] font-bold text-slate-500 mb-1.5">기타</div>
                  <textarea x-model="data.dailyMemos[owner]"
                            @blur="saveDailyMemo(owner)"
                            placeholder="메모를 입력하세요..."
                            rows="2"
                            class="w-full text-xs border border-slate-200 rounded-lg px-3 py-2 resize-none outline-none focus:border-blue-400 bg-white"></textarea>
                </div>

                <!-- ⑥ 담당자별 댓글 영역 (기존 유지) -->
                <div class="bg-slate-50 border-t border-slate-100 px-4 py-3">
                  <div class="flex items-center justify-between mb-2">
                    <p class="text-[10px] text-slate-400 font-medium uppercase" x-text="owner + ' 전체 현황 댓글'"></p>
                    <button @click="commentWeekView = !commentWeekView"
                            class="text-[10px] px-2 py-0.5 rounded-full transition font-medium"
                            :class="commentWeekView ? 'bg-blue-100 text-blue-600' : 'bg-slate-200 text-slate-500 hover:bg-slate-300'"
                            x-text="commentWeekView ? '주차별' : '전체'"></button>
                  </div>

                  <!-- 전체 보기 (기존) -->
                  <div x-show="!commentWeekView" class="space-y-2 mb-3 max-h-60 overflow-y-auto">
                    <template x-for="comment in ([...((_commentsCache || {})[owner] || [])].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)))" :key="'c-' + comment.id">
                      <div class="bg-white rounded-lg px-3 py-2 border border-slate-200 group">
                        <div class="flex items-start gap-2">
                          <span class="inline-flex items-center justify-center w-5 h-5 bg-slate-200 text-slate-500 rounded-full text-[9px] font-bold flex-shrink-0 mt-0.5">익</span>
                          <p class="text-xs text-slate-700 flex-1 whitespace-pre-wrap" x-text="comment.text"></p>
                          <button @click.stop="removeComment(owner, comment.id)" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 text-xs transition flex-shrink-0">&times;</button>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-1 ml-7" x-text="formatCommentTime(comment.createdAt)"></p>
                      </div>
                    </template>
                    <div x-show="((_commentsCache || {})[owner] || []).length === 0 && !dailyCommentsLoading" class="text-center py-3 text-slate-400">
                      <p class="text-xs">아직 댓글이 없습니다</p>
                    </div>
                    <div x-show="dailyCommentsLoading" class="text-center py-3">
                      <span class="text-xs text-slate-400">불러오는 중...</span>
                    </div>
                  </div>

                  <!-- 주차별 보기 -->
                  <div x-show="commentWeekView" class="space-y-3 mb-3 max-h-72 overflow-y-auto">
                    <template x-for="(week, weekIdx) in groupCommentsByWeek(owner)" :key="'w-' + week.weekStart">
                      <div x-data="{ open: false }" x-init="open = (weekIdx === 0)" class="border border-slate-200 rounded-lg overflow-hidden bg-white">
                        <button @click="open = !open" class="w-full flex items-center justify-between px-3 py-2 hover:bg-slate-50 transition">
                          <span class="text-[11px] font-semibold text-slate-600" x-text="formatWeekLabel(week.weekStart)"></span>
                          <span class="flex items-center gap-1.5">
                            <span class="text-[10px] px-1.5 py-0.5 bg-blue-50 text-blue-500 rounded-full" x-text="week.comments.length + '건'"></span>
                            <svg class="w-3 h-3 text-slate-400 transition-transform" :class="open && 'rotate-180'" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                          </span>
                        </button>
                        <div x-show="open" x-transition class="border-t border-slate-100 px-3 py-2 space-y-2">
                          <template x-for="comment in [...week.comments].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))" :key="'wc-' + comment.id">
                            <div class="bg-slate-50 rounded-lg px-3 py-2 group">
                              <div class="flex items-start gap-2">
                                <span class="inline-flex items-center justify-center w-5 h-5 bg-slate-200 text-slate-500 rounded-full text-[9px] font-bold flex-shrink-0 mt-0.5">익</span>
                                <p class="text-xs text-slate-700 flex-1 whitespace-pre-wrap" x-text="comment.text"></p>
                                <button @click.stop="removeComment(owner, comment.id)" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 text-xs transition flex-shrink-0">&times;</button>
                              </div>
                              <p class="text-[10px] text-slate-400 mt-1 ml-7" x-text="formatCommentTime(comment.createdAt)"></p>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>
                    <div x-show="groupCommentsByWeek(owner).length === 0 && !dailyCommentsLoading" class="text-center py-3 text-slate-400">
                      <p class="text-xs">아직 댓글이 없습니다</p>
                    </div>
                  </div>

                  <!-- 댓글 입력 -->
                  <div class="flex gap-2">
                    <input x-model="dailyNewComment"
                           @keydown.enter="addComment(owner)"
                           placeholder="전체 현황에 대한 익명 댓글..."
                           class="flex-1 px-3 py-2 text-xs border border-slate-200 rounded-lg outline-none focus:border-blue-400 bg-white">
                    <button @click="addComment(owner)"
                            class="px-3 py-2 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium">전송</button>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- 빈 상태 -->
          <div x-show="dailyOwnerNames.length === 0" class="text-center py-12 text-slate-400">
            <svg class="w-12 h-12 mx-auto mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <p class="text-sm">진행 중인 프로젝트가 없습니다</p>
            <p class="text-xs mt-1">목요일 리포트에서 담당자가 배정된 프로젝트를 추가하세요</p>
          </div>
        </div>
      </div>

    </section>
    </template>
