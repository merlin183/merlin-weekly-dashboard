    <template x-if="activeTab === 'todos'">
    <section x-transition class="space-y-4">

      <!-- 상단: 필터 + 통계 + 액션 -->
      <div class="flex items-center justify-between flex-wrap gap-3">
        <!-- 멤버 필터 -->
        <div class="flex gap-1 bg-slate-100 p-1 rounded-lg flex-wrap">
          <button @click="todoFilter = 'all'" class="px-3 py-1.5 text-xs rounded-md transition"
                  :class="todoFilter === 'all' ? 'bg-white text-slate-900 font-medium shadow-sm' : 'text-slate-500 hover:text-slate-700'">전체</button>
          <template x-for="m in visibleMembers" :key="'tf-' + m">
            <button @click="todoFilter = m" class="px-3 py-1.5 text-xs rounded-md transition"
                    :class="todoFilter === m ? 'bg-white text-slate-900 font-medium shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                    x-text="m"></button>
          </template>
        </div>

        <div class="flex items-center gap-3">
          <!-- 통계 배지 -->
          <div class="flex gap-2 text-xs">
            <span class="px-2 py-1 bg-amber-50 text-amber-600 rounded-md">
              대기 <span class="font-bold" x-text="todoCountByStatus('todo')"></span>
            </span>
            <span class="px-2 py-1 bg-blue-50 text-blue-600 rounded-md">
              진행 <span class="font-bold" x-text="todoCountByStatus('in_progress')"></span>
            </span>
            <span class="px-2 py-1 bg-emerald-50 text-emerald-600 rounded-md">
              완료 <span class="font-bold" x-text="todoCountByStatus('done')"></span>
            </span>
          </div>

          <!-- Slack 설정 (admin only) -->
          <button x-show="isAdmin()" @click="openSlackSettings()" class="px-3 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg transition flex items-center gap-1">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
            Slack 설정
          </button>

          <!-- 할일 추가 -->
          <button @click="openTodo(-1)" class="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium">+ 할일 추가</button>
        </div>
      </div>

      <!-- 할일 카드 목록 -->
      <div class="space-y-2">
        <template x-for="(todo, tIdx) in filteredTodos" :key="todo.id || tIdx">
          <div class="bg-white border border-slate-200 rounded-xl p-4 hover:shadow-sm transition group"
               :class="todo.status === 'done' ? 'opacity-60' : ''">
            <div class="flex items-start gap-3">
              <!-- 체크박스 -->
              <button @click="toggleTodoStatus(tIdx)" class="mt-0.5 flex-shrink-0">
                <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition"
                     :class="todo.status === 'done' ? 'border-emerald-500 bg-emerald-500' : 'border-slate-300 hover:border-blue-400'">
                  <svg x-show="todo.status === 'done'" class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
                  </svg>
                </div>
              </button>

              <!-- 할일 내용 -->
              <div class="flex-1 min-w-0" @click="openTodo(todos.findIndex(t => t.id === todo.id))" style="cursor:pointer;">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-sm font-medium" :class="todo.status === 'done' ? 'line-through text-slate-400' : 'text-slate-800'" x-text="todo.title"></span>
                  <span x-show="todo.priority" class="text-[10px] px-1.5 py-0.5 rounded font-medium" :class="todoPriorityClass(todo.priority)" x-text="todoPriorityLabel(todo.priority)"></span>
                  <span x-show="todo.status === 'in_progress'" class="text-[10px] px-1.5 py-0.5 rounded font-medium bg-blue-100 text-blue-600">진행중</span>
                </div>
                <div x-show="todo.description" class="text-xs text-slate-400 mt-1 line-clamp-1" x-text="todo.description"></div>
                <div class="flex items-center gap-3 mt-2 flex-wrap">
                  <!-- 담당자 -->
                  <div x-show="todo.assignee" class="flex items-center gap-1">
                    <div class="w-4 h-4 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-[8px] font-bold text-white" x-text="todo.assignee?.charAt(0)"></div>
                    <span class="text-[11px] text-slate-500" x-text="todo.assignee"></span>
                  </div>
                  <!-- 배정자 -->
                  <span x-show="todo.assignedBy" class="text-[11px] text-slate-400" x-text="'← ' + todo.assignedBy"></span>
                  <!-- 마감일 -->
                  <span x-show="todo.dueDate" class="text-[10px] px-1.5 py-0.5 rounded font-medium" :class="todoDueBadge(todo.dueDate)" x-text="todoDueText(todo.dueDate)"></span>
                  <span x-show="todo.dueDate" class="text-[11px] text-slate-400" x-text="todo.dueDate"></span>
                </div>
              </div>

              <!-- 삭제 -->
              <button @click="removeTodo(tIdx)" class="opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 text-xs transition flex-shrink-0 mt-1">&times;</button>
            </div>
          </div>
        </template>

        <!-- 빈 상태 -->
        <div x-show="filteredTodos.length === 0" class="text-center py-16 text-slate-400">
          <svg class="w-12 h-12 mx-auto mb-3 text-slate-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
          <p class="text-sm">할일이 없습니다</p>
          <button @click="openTodo(-1)" class="mt-3 px-4 py-2 text-xs bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">+ 첫 할일 추가</button>
        </div>
      </div>
    </section>
    </template>
