              <div>
                <label class="block text-[10px] font-medium text-slate-500 mb-1">사유</label>
                <input x-model="hrLeaveForm.reason" placeholder="사유 입력" class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none">
              </div>
              <div class="flex items-end gap-2">
                <button @click="submitLeave()" class="px-4 py-1.5 text-xs bg-violet-600 hover:bg-violet-700 text-white rounded-lg transition font-medium">신청</button>
                <button @click="hrLeaveForm.show = false" class="px-4 py-1.5 text-xs text-slate-500 hover:text-slate-700">취소</button>
              </div>
            </div>
          </div>

          <!-- 연차 신청 목록 — 공용(legacy) 세션은 통째로 숨김. 백엔드도 admin/pm=전체, member=본인만 -->
          <div x-show="!isLegacy()">
            <div class="flex items-center gap-2 mb-2">
              <h3 class="text-xs font-bold text-slate-600">신청 내역</h3>
              <span class="text-[10px] text-slate-400"
                    x-text="(isAdmin() || isPm()) ? '· 전체 보기 (관리자/PM)' : '· 본인 신청 내역만'"></span>
            </div>
            <div class="overflow-x-auto rounded-xl border border-slate-200">
              <table class="w-full text-xs">
                <thead class="bg-slate-50 border-b border-slate-200">
                  <tr>
                    <th class="px-3 py-2 text-left font-semibold text-slate-600">신청자</th>
                    <th class="px-3 py-2 text-left font-semibold text-slate-600">종류</th>
                    <th class="px-3 py-2 text-left font-semibold text-slate-600">기간</th>
                    <th class="px-3 py-2 text-center font-semibold text-slate-600">일수</th>
                    <th class="px-3 py-2 text-left font-semibold text-slate-600">사유</th>
                    <th class="px-3 py-2 text-center font-semibold text-slate-600">상태</th>
                    <th class="px-3 py-2 text-center font-semibold text-slate-600 w-32">처리</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="req in hrLeaveRequests" :key="'lr-' + req.id">
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition">
                      <td class="px-3 py-2 font-medium text-slate-700" x-text="req.user_name"></td>
                      <td class="px-3 py-2 text-slate-600" x-text="req.leave_type"></td>
                      <td class="px-3 py-2 text-slate-600 tabular-nums" x-text="req.start_date === req.end_date ? req.start_date : req.start_date + ' ~ ' + req.end_date"></td>
                      <td class="px-3 py-2 text-center text-slate-600" x-text="req.days + '일'"></td>
                      <td class="px-3 py-2 text-slate-500" x-text="req.reason || '-'"></td>
                      <td class="px-3 py-2 text-center">
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold"
                              :class="req.status === '승인' ? 'bg-emerald-100 text-emerald-700' : req.status === '반려' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'"
                              x-text="req.status"></span>
                        <div class="mt-1 flex flex-col items-center gap-0.5 text-[9px] leading-tight">
                          <span><span class="text-slate-400">1차 PM</span>
                            <span :class="(req.pm_status||'대기')==='승인'?'text-emerald-600 font-medium':(req.pm_status||'대기')==='반려'?'text-red-500 font-medium':'text-amber-500'"
                                  x-text="(req.pm_approver||'-') + ' ' + (req.pm_status||'대기')"></span></span>
                          <span><span class="text-slate-400">2차 대표</span>
                            <span :class="(req.admin_status||'대기')==='승인'?'text-emerald-600 font-medium':(req.admin_status||'대기')==='반려'?'text-red-500 font-medium':'text-slate-400'"
                                  x-text="(req.admin_approver||'-') + ' ' + (req.admin_status||'대기')"></span></span>
                        </div>
                      </td>
                      <td class="px-3 py-2 text-center">
                        <template x-if="req.status === '대기'">
                          <div class="flex items-center justify-center gap-1 flex-wrap">
                            <template x-if="isMyLeaveInbox(req)">
                              <button @click="approveLeave(req.id, '승인')" class="px-2 py-0.5 text-[10px] bg-emerald-100 text-emerald-700 rounded-lg hover:bg-emerald-200 transition font-medium"
                                      x-text="leaveStageOf(req)==='pm' ? '1차 승인' : '최종 승인'"></button>
                            </template>
                            <template x-if="isMyLeaveInbox(req)">
                              <button @click="approveLeave(req.id, '반려')" class="px-2 py-0.5 text-[10px] bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition font-medium">반려</button>
                            </template>
                            <template x-if="currentUser && (req.user_name === currentUser.name || isAdmin())">
                              <button @click="cancelLeave(req.id)" class="px-2 py-0.5 text-[10px] text-slate-400 hover:text-red-500 transition">취소</button>
                            </template>
                          </div>
                        </template>
                        <template x-if="req.status !== '대기'">
                          <div class="flex items-center justify-center gap-1 flex-wrap">
                            <span class="text-[10px] text-slate-400" x-text="req.approver ? req.approver + ' 처리' : ''"></span>
                            <template x-if="isAdmin() || isPm()">
                              <button @click="cancelLeave(req.id)" class="px-2 py-0.5 text-[10px] text-slate-400 hover:text-red-500 transition">삭제</button>
                            </template>
                          </div>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div x-show="hrLeaveRequests.length === 0 && !hrLeaveLoading" class="text-center py-6 text-slate-400 text-xs">연차 신청 내역이 없습니다</div>
          </div>
        </div>

        <!-- ── 캘린더 섹션 (월간 그리드) ── -->
        <div x-show="hrTab === 'calendar'" class="space-y-4">
          <div class="flex items-center gap-2 mb-2">
            <button @click="calShiftMonth(-1)"
                    class="w-7 h-7 flex items-center justify-center rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition">‹</button>
            <h3 class="text-sm font-bold text-slate-700 min-w-[100px] text-center" x-text="calMonthLabel"></h3>
            <button @click="calShiftMonth(1)"
                    class="w-7 h-7 flex items-center justify-center rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition">›</button>
            <button @click="calGoToday()"
                    class="text-[10px] px-2 py-1 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition ml-1">오늘</button>
            <button @click="loadCalendar()" :disabled="calLoading"
                    class="text-[10px] px-2 py-1 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 transition ml-auto"
                    x-text="calLoading ? '로딩...' : '↻'"></button>
          </div>

          <!-- 일정 추가 버튼 -->
          <button x-show="!isLegacy()" @click="calEventForm.show = !calEventForm.show"
                  class="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium">
            + 일정 추가
          </button>

          <!-- 일정 추가 폼 -->
          <div x-show="calEventForm.show" x-transition class="p-4 bg-blue-50 border border-blue-200 rounded-xl space-y-3">
            <div class="grid grid-cols-4 gap-3">
              <div class="col-span-2">
                <label class="block text-[10px] font-medium text-slate-500 mb-1">제목 <span class="text-red-500">*</span></label>
                <input x-model="calEventForm.title" placeholder="예: 팀 회의"
                       class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none focus:border-blue-400">
              </div>
              <div>
                <label class="block text-[10px] font-medium text-slate-500 mb-1">시작일 <span class="text-red-500">*</span></label>
                <input type="date" x-model="calEventForm.start_date"
                       class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none">
              </div>
              <div>
                <label class="block text-[10px] font-medium text-slate-500 mb-1">종료일</label>
                <input type="date" x-model="calEventForm.end_date"
                       class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none">
              </div>
            </div>
            <div class="grid grid-cols-4 gap-3">
              <div>
                <label class="flex items-center gap-2 text-[10px] text-slate-600 mt-1">
                  <input type="checkbox" x-model="calEventForm.all_day" class="rounded border-slate-300">
                  종일
                </label>
              </div>
              <div x-show="!calEventForm.all_day">
                <label class="block text-[10px] font-medium text-slate-500 mb-1">시작 시간</label>
                <input type="time" x-model="calEventForm.start_time"
                       class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none">
              </div>
              <div x-show="!calEventForm.all_day">
                <label class="block text-[10px] font-medium text-slate-500 mb-1">종료 시간</label>
                <input type="time" x-model="calEventForm.end_time"
                       class="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs outline-none">
              </div>
              <div class="flex items-end gap-2">
                <button @click="addCalEvent()" class="px-4 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-medium">추가</button>
                <button @click="calEventForm.show = false" class="px-4 py-1.5 text-xs text-slate-500 hover:text-slate-700">취소</button>
              </div>
            </div>
          </div>

          <!-- 월간 그리드 (calMoreDate: '+N more' 클릭 시 해당 날짜 전체 일정 팝업) -->
          <div x-data="{ calMoreDate: '' }" @keydown.escape.window="calMoreDate = ''">
            <!-- 요일 헤더 (일요일 시작) -->
            <div class="grid grid-cols-7 gap-1 mb-1 text-[11px] font-bold text-center">
              <div class="text-red-500 py-1">일</div>
              <div class="text-slate-500 py-1">월</div>
              <div class="text-slate-500 py-1">화</div>
              <div class="text-slate-500 py-1">수</div>
              <div class="text-slate-500 py-1">목</div>
              <div class="text-slate-500 py-1">금</div>
              <div class="text-blue-500 py-1">토</div>
            </div>
            <!-- 6주 × 7일 셀 -->
            <div class="grid grid-cols-7 gap-1">
              <template x-for="cell in calGrid" :key="'cal-' + cell.date">
                <div class="min-h-[88px] p-1.5 rounded-lg border text-xs cursor-pointer transition"
                     :class="[
                       isHoliday(cell.date) ? 'bg-red-50' : (cell.inMonth ? 'bg-white' : 'bg-slate-50'),
                       cell.isToday ? 'border-blue-500 ring-1 ring-blue-200' : (isHoliday(cell.date) ? 'border-red-200 hover:border-red-300' : 'border-slate-200 hover:border-blue-300'),
                     ]"
                     @click="calOpenEventForm(cell.date)">
                  <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] font-bold"
                          :class="!cell.inMonth ? 'text-slate-300' :
                                  cell.isToday ? 'text-blue-700' :
                                  (isHoliday(cell.date) || cell.isSunday) ? 'text-red-500' :
                                  cell.isSaturday ? 'text-blue-500' : 'text-slate-700'"
                          x-text="cell.day"></span>
                  </div>
                  <div class="space-y-0.5">
                    <template x-for="ev in cell.events.slice(0, 3)" :key="'ev-' + ev.id + '-' + cell.date">
                      <div class="group/ev px-1.5 py-0.5 rounded text-[10px] font-medium truncate flex items-center justify-between gap-1"
                           :class="ev.isHoliday ? 'bg-red-100 text-red-700' : ev.isLeave ? 'bg-violet-100 text-violet-700' : 'bg-blue-100 text-blue-700'"
                           @click.stop
                           :title="ev.title + (ev.isMultiDay ? ' (' + ev.endDate + '까지)' : '') + (ev.description ? ' — ' + ev.description : '')">
                        <span class="truncate flex-1">
                          <span x-show="!ev.allDay" class="text-[9px] opacity-70 mr-0.5" x-text="ev.startTime"></span>
                          <span x-text="ev.title"></span>
                          <span x-show="ev.isMultiDay && ev.isStart" class="text-[9px] opacity-70 ml-0.5">→</span>
                        </span>
                        <button x-show="!ev.isHoliday" @click.stop="deleteCalEvent(ev.id)"
                                class="opacity-0 group-hover/ev:opacity-100 text-slate-400 hover:text-red-500 text-[11px] leading-none px-0.5">×</button>
                      </div>
                    </template>
                    <div x-show="cell.events.length > 3"
                         class="text-[9px] text-slate-400 hover:text-slate-600 px-1.5 cursor-pointer"
                         @click.stop="calMoreDate = cell.date"
                         x-text="'+' + (cell.events.length - 3) + ' more'"></div>
                  </div>
                </div>
              </template>
            </div>

            <!-- 날짜별 전체 일정 팝업 -->
            <div x-show="calMoreDate" x-transition class="fixed inset-0 bg-black/30 z-50 flex items-center justify-center p-4" @click.self="calMoreDate = ''" style="display:none">
              <div class="bg-white rounded-2xl shadow-xl w-[420px] max-h-[90vh] overflow-hidden flex flex-col" @click.stop>
                <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                  <h3 class="text-sm font-bold text-slate-800"
                      x-text="calMoreDate ? (Number(calMoreDate.slice(5,7)) + '월 ' + Number(calMoreDate.slice(8,10)) + '일 일정 (' + _eventsForDate(calMoreDate).length + '건)') : ''"></h3>
                  <button @click="calMoreDate = ''" class="text-slate-400 hover:text-slate-600 text-lg">&times;</button>
                </div>
                <div class="p-5 space-y-1.5 overflow-y-auto">
                  <template x-for="ev in (calMoreDate ? _eventsForDate(calMoreDate) : [])" :key="'more-' + ev.id">
                    <div class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center justify-between gap-2"
                         :class="ev.isHoliday ? 'bg-red-100 text-red-700' : ev.isLeave ? 'bg-violet-100 text-violet-700' : 'bg-blue-100 text-blue-700'">
                      <div class="min-w-0 flex-1">
                        <div class="truncate">
                          <span x-show="!ev.allDay" class="text-[10px] opacity-70 mr-1" x-text="ev.startTime"></span>
                          <span x-text="ev.title"></span>
                        </div>
                        <div x-show="ev.isMultiDay" class="text-[10px] opacity-70" x-text="'~ ' + ev.endDate + '까지'"></div>
                        <div x-show="ev.description" class="text-[10px] opacity-70 truncate" x-text="ev.description"></div>
                      </div>
                      <button x-show="!ev.isHoliday" @click="deleteCalEvent(ev.id)"
                              class="text-slate-400 hover:text-red-500 text-sm leading-none px-1">×</button>
                    </div>
                  </template>
                  <div x-show="calMoreDate && _eventsForDate(calMoreDate).length === 0" class="text-center text-xs text-slate-400 py-4">일정이 없습니다.</div>
                </div>
              </div>
            </div>
          </div>
          <div x-show="calLoading" class="text-center py-2 text-slate-400 text-xs">로딩 중...</div>

          <div class="flex items-center gap-3 text-[10px] text-slate-500 pt-1">
            <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded bg-violet-200"></span>연차/반차/공가/경조/무급</span>
            <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded bg-red-200"></span>공휴일</span>
            <span class="ml-auto text-slate-400" x-text="hrUser ? ('* ' + hrUser + ' 님의 연차만 표시 중') : '* 사용자 선택 시 그 사람 연차만 필터'"></span>
          </div>
          <p class="text-[10px] text-slate-400">* 연차 승인 시 자동으로 캘린더에 등록됩니다. 회의 일정은 회의록 탭의 캘린더에서 확인하세요.</p>
        </div>
      </div>
    </section>
    </template>
