    <template x-if="activeTab === 'kanban'">
    <section x-transition :class="devMode ? 'dev-parent dev-outline' : ''">
      <div x-show="devMode" class="dev-badge" @click.stop="navigator.clipboard.writeText($el.innerText).then(() => { $el.classList.add('dev-copied'); setTimeout(() => $el.classList.remove('dev-copied'), 800) })" style="cursor:pointer">
        <span class="dev-api">PUT /api/report</span> · <span class="dev-data">data.kanbanColumns</span> · <span class="dev-file">index.html:543</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <template x-for="col in data.kanbanColumns" :key="col.id">
          <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
            <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
              <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full" :class="col.dotColor"></span>
                <span class="text-sm font-medium text-slate-700" x-text="col.name"></span>
              </div>
              <span class="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full" x-text="col.issues.length"></span>
            </div>
            <div class="p-3 space-y-2 max-h-[500px] overflow-y-auto">
              <template x-for="(issue, iIdx) in col.issues" :key="issue.id || iIdx">
                <div @click="openIssue(col.id, iIdx)" class="bg-slate-50 border border-slate-200 rounded-lg p-3 hover:border-blue-300 hover:shadow-sm transition cursor-pointer group relative">
                  <button @click.stop="removeIssue(col.id, iIdx)" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 text-slate-300 hover:text-red-400 text-xs transition">&times;</button>
                  <p class="text-sm text-slate-700 leading-snug pr-4" x-text="issue.title"></p>
                  <div class="flex items-center justify-between mt-2">
                    <span class="text-xs text-slate-400 font-mono" x-text="issue.identifier"></span>
                    <div class="flex items-center gap-1.5">
                      <span x-show="issue.priority > 0" class="text-[10px] px-1.5 py-0.5 rounded font-medium" :class="priorityClass(issue.priority)" x-text="priorityLabel(issue.priority)"></span>
                      <div x-show="issue.assignee" class="w-5 h-5 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-[10px] font-bold text-white" x-text="issue.assignee?.charAt(0)" :title="issue.assignee"></div>
                    </div>
                  </div>
                </div>
              </template>
              <!-- 추가 -->
              <button @click="openIssue(col.id, -1)" class="w-full border border-dashed border-slate-200 rounded-lg py-2 text-xs text-slate-400 hover:border-blue-300 hover:text-blue-500 transition">+ 추가</button>
            </div>
          </div>
        </template>
      </div>
    </section>
    </template>
